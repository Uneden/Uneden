# Local full-stack run: `docker compose up --build`
#   backend  → http://localhost:5000  (Express, talks to Supabase)
#   frontend → http://localhost:3000  (Next.js, calls the backend)
#
# Both services read the same .env files you already use for `npm run dev`.

services:
  backend:
    build: ./backend
    image: uneden-backend
    env_file: ./backend/.env
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      secrets:
        # NEXT_PUBLIC_* are baked in at build time; the secret mount keeps the
        # env file out of the image layers (see frontend/Dockerfile).
        - frontend_env
    image: uneden-frontend
    env_file: ./frontend/.env.local
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

secrets:
  frontend_env:
    file: ./frontend/.env.local
