name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# Public demo credentials of every local Supabase instance (not secrets).
env:
  SUPABASE_URL: http://127.0.0.1:54321
  SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
  SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
  SUPABASE_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
  DATABASE_SSL: "false"

jobs:
  playwright:
    name: Playwright (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # Postgres + Auth + Storage from supabase/migrations + supabase/seed.sql.
      # Docker is preinstalled on ubuntu-latest runners.
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,logflare,vector,edge-runtime,mailpit

      - name: Install backend
        working-directory: backend
        run: npm ci

      - name: Start backend
        working-directory: backend
        env:
          PORT: 5000
          FRONTEND_URL: http://localhost:3000
          APP_NAME: Uneden
          ADMIN_EMAILS: admin@test.local
          SUPPORT_EMAILS: support@test.local
          # Stripe / email / push are not exercised: placeholders keep the
          # SDK constructors happy without reaching any external service.
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          EMAIL_HOST: 127.0.0.1
          EMAIL_PORT: 2525
          EMAIL_USER: test
          EMAIL_PASSWORD: test
          RESEND_API_KEY: re_placeholder
        run: |
          npm start > ../backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5000/api/health && break
            sleep 1
          done
          curl -sf http://localhost:5000/api/health

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_URL: http://localhost:5000/api
          NEXT_PUBLIC_ADMIN_EMAILS: admin@test.local
          NEXT_PUBLIC_SUPPORT_EMAILS: support@test.local
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ""
          NEXT_PUBLIC_COMING_SOON: "false"
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_IMAGES_UNOPTIMIZED: 1
        run: npm run build

      - name: Start frontend
        working-directory: frontend
        run: |
          npx next start -p 3000 > ../frontend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:3000/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:3000/

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # flow-transaction drives a real Stripe checkout: needs test-mode keys, run manually.
      - name: Run Playwright
        working-directory: frontend
        env:
          CI: "true"
        run: |
          cp .env.test.example .env.test
          npx playwright test --project=chromium --grep-invert "flow-transaction"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            backend.log
            frontend.log
          retention-days: 14
