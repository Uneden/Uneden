name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks — secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan the whole history, not just the last commit

      # Official image, run directly: no license key needed (the marketplace
      # action requires one for organization repositories).
      - name: Scan repository history
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            git /repo --no-banner --redact \
            --config /repo/.gitleaks.toml --gitleaks-ignore-path /repo
